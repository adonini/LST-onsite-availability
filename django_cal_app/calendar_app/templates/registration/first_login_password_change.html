{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row">
    <div class="col-11 col-md-4 mx-auto mt-5">
        <div class="card card-default rounded-0 shadow">
            <div class="card-header text-center">
                <h3 class="card-title"><b>Set your new password</b></h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-outline-dark w-100">Save new password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
