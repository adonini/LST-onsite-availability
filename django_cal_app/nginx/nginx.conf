server {
    listen 80;

    server_name localhost 161.72.87.51 calendar.lst.iac.es calendar.lst1.iac.es;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_upstream http://app:8000;

    location /static/ {
        alias /usr/share/nginx/html/static/;  # Static files directory
    }

    location / {
	proxy_pass $django_upstream;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
    }
}
